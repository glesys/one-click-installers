{{>users}}

packages:
  - ca-certificates
  - curl
  - git
  - vim
  - fail2ban

write_files:
  -
    path: '/etc/systemd/system/docker-jitsi.service'
    content: |-
      [Unit]
      Description=Docker Compose service for jitsi
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/root/docker-jitsi-meet
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300
      [Install]
      WantedBy=multi-user.target
  -
    path: '/root/jitsi.env'
    content: |
      CONFIG=/root/.jitsi-meet-cfg
      HTTP_PORT=80
      HTTPS_PORT=443
      TZ=Europe/Amsterdam
      PUBLIC_URL=https://{{ params.hostname }}
      ENABLE_HTTP_REDIRECT=1
      ENABLE_LETSENCRYPT=1
      LETSENCRYPT_DOMAIN={{ params.hostname }}
      LETSENCRYPT_EMAIL={{ params.email }}

runcmd:
    - 'install -m 0755 -d /etc/apt/keyrings'
    - 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc'
    - 'chmod a+r /etc/apt/keyrings/docker.asc'
    - 'printf "Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nSigned-By: /etc/apt/keyrings/docker.asc\n" "$(. /etc/os-release && echo "$VERSION_CODENAME")" > /etc/apt/sources.list.d/docker.sources'
    - 'apt-get update -y'
    - 'apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'
    - 'systemctl enable --now docker'
    - 'git clone --branch stable-11509-1 --depth 1 https://github.com/jitsi/docker-jitsi-meet /root/docker-jitsi-meet'
    - 'grep -v -E "^(CONFIG|HTTP_PORT|HTTPS_PORT|TZ)=" /root/docker-jitsi-meet/env.example > /root/docker-jitsi-meet/.env'
    - 'cat /root/jitsi.env >> /root/docker-jitsi-meet/.env'
    - 'cd /root/docker-jitsi-meet && ./gen-passwords.sh'
    - 'mkdir -p /root/.jitsi-meet-cfg/web /root/.jitsi-meet-cfg/prosody/config /root/.jitsi-meet-cfg/prosody/prosody-plugins-custom /root/.jitsi-meet-cfg/jicofo /root/.jitsi-meet-cfg/jvb /root/.jitsi-meet-cfg/jigasi /root/.jitsi-meet-cfg/jibri /root/.jitsi-meet-cfg/transcriber'
    - 'mkdir -p /root/.jitsi-meet-cfg/storage/jibri /root/.jitsi-meet-cfg/storage/prosody /root/.jitsi-meet-cfg/storage/transcripts /root/.jitsi-meet-cfg/storage/web'
    - 'mkdir -p /root/.jitsi-meet-cfg/tmp/web-crontabs /root/.jitsi-meet-cfg/tmp/web-load-test'
    - 'chmod 777 /root/.jitsi-meet-cfg/storage/jibri /root/.jitsi-meet-cfg/storage/prosody /root/.jitsi-meet-cfg/storage/transcripts /root/.jitsi-meet-cfg/storage/web /root/.jitsi-meet-cfg/tmp/web-crontabs /root/.jitsi-meet-cfg/tmp/web-load-test'
    - 'systemctl daemon-reload'
    - 'systemctl enable --now docker-jitsi'
    - 'ufw default deny incoming'
    - 'ufw allow OpenSSH'
    - 'ufw allow http'
    - 'ufw allow https'
    - 'ufw allow 10000/udp'
    - 'ufw --force enable'
